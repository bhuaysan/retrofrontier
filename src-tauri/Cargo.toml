[package]
name = "retrofrontier"
version = "0.1.0"
description = "RetroFrontier desktop application"
authors = ["RetroFrontier contributors"]
edition = "2021"
rust-version = "1.94"
build = "build.rs"

[lib]
name = "retrofrontier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
