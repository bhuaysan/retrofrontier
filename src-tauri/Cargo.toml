[package]
name = "retrofrontier"
version = "0.1.0"
description = "RetroFrontier desktop application"
authors = ["RetroFrontier contributors"]
edition = "2021"
rust-version = "1.94"
build = "build.rs"

[lib]
name = "retrofrontier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
backhand = { version = "=0.25.1", default-features = false, features = ["gzip", "lz4", "xz", "zstd"] }
crc32fast = "1.5"
fs4 = { version = "=1.1.0", features = ["sync"] }
futures = "0.3"
md-5 = "0.11"
notify = "8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "=0.22.0", default-features = false, features = ["util"] }
sha2 = "0.11"
sha1 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "runtime-tokio", "sqlite", "migrate"] }
tar = "=0.4.46"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tough = { version = "=0.24.0", features = ["http"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
keyring = "4.1"

[dev-dependencies]
tempfile = "3.27.0"
