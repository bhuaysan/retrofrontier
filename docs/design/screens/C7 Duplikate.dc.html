<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="C7" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:20px; max-width:760px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK
    </button>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; white-space:nowrap; flex-shrink:0">▶ DUPLIKATE</h2>
      <span style="flex:1; height:3px; background:var(--border)"></span>
      <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim); white-space:nowrap">{{ groupCount }} TITEL BETROFFEN</span>
    </div>

    <p style="font-size:15px; line-height:1.6; color:var(--text-dim); text-wrap:pretty">Für jeden Titel liegen mehrere Dateien vor. Wähle pro Titel eine bevorzugte Version — die anderen werden aus der Bibliothek ausgeblendet, bleiben aber auf der Festplatte.</p>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow)">
        <h3 style="font-family:'Press Start 2P', monospace; font-size:10px; letter-spacing:1px; padding:12px 16px; border-bottom:2px solid var(--border); background:var(--surface-2)">{{ g.title }}</h3>
        <sc-for list="{{ g.variants }}" as="v" hint-placeholder-count="3">
          <button type="button" onClick="{{ v.onPick }}" style="display:flex; align-items:center; gap:14px; padding:12px 16px; width:100%; border:none; border-top:{{ v.border }}; background:{{ v.rowBg }}; cursor:pointer; text-align:left; font-family:inherit; color:var(--text)" style-hover="background:var(--bg-soft)" style-focus="background:var(--text); color:var(--bg)">
            <span style="width:22px; height:22px; flex:none; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); background:{{ v.checkBg }}"></span>
            <div style="flex:1; min-width:0">
              <b style="display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ v.filename }}</b>
              <small style="font-family:'VT323', monospace; font-size:17px; color:var(--text-dim)">{{ v.size }}</small>
            </div>
            <span style="font-family:'VT323', monospace; font-size:15px; padding:1px 8px; border:2px solid var(--border); background:var(--chip-bg); color:var(--text); font-weight:700; letter-spacing:1px">{{ v.region }}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>

    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-top:6px">
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--accent); color:#000; cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">AUSWAHL ÜBERNEHMEN</button>
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">ALLE BEHALTEN</button>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const GROUPS = [
  {
    id: 'ct', title: 'CHRONO TRIGGER',
    variants: [
      { id: 'us', filename: 'Chrono Trigger (USA).sfc', size: '4 MB', region: 'US' },
      { id: 'jp', filename: 'Chrono Trigger (Japan).sfc', size: '4 MB', region: 'JP' }
    ], picked: 'us'
  },
  {
    id: 'sf2', title: 'STREET FIGHTER II',
    variants: [
      { id: 'ce', filename: 'Street Fighter II - Champion Edition (World).zip', size: '2 MB', region: 'WORLD' },
      { id: 'hf', filename: 'Street Fighter II - Hyper Fighting (World).zip', size: '2 MB', region: 'WORLD' },
      { id: 'ii', filename: "Street Fighter II' - Champion Edition (Japan).zip", size: '2 MB', region: 'JP' }
    ], picked: 'ce'
  },
  {
    id: 'zelda', title: "THE LEGEND OF ZELDA - LINK'S AWAKENING",
    variants: [
      { id: 'eu', filename: "Legend of Zelda - Link's Awakening (USA, Europe).gb", size: '512 KB', region: 'US/EU' },
      { id: 'dx', filename: "Legend of Zelda - Link's Awakening DX (USA, Europe).gbc", size: '1 MB', region: 'US/EU' }
    ], picked: 'dx'
  }
];

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null, picks: Object.fromEntries(GROUPS.map(g => [g.id, g.picked])) }; }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    const picks = this.state.picks;
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      groupCount: GROUPS.length,
      groups: GROUPS.map(g => ({
        title: g.title,
        variants: g.variants.map((v, i) => {
          const picked = picks[g.id] === v.id;
          return {
            ...v,
            border: i === 0 ? 'none' : '2px solid var(--border)',
            rowBg: picked ? 'var(--accent-3)' : 'transparent',
            checkBg: picked ? '#000' : 'var(--bg-soft)',
            onPick: () => this.setState(s => ({ picks: { ...s.picks, [g.id]: v.id } }))
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
