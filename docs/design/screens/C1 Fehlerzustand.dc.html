<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="C1" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:20px; max-width:760px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK
    </button>

    <div style="display:grid; grid-template-columns:200px 1fr; gap:24px">
      <div style="width:100%; border:3px solid var(--border); box-shadow:6px 6px 0 var(--shadow); aspect-ratio:3/4; background:linear-gradient(160deg, #232a5e, #2f5d3a); filter:grayscale(0.6) brightness(0.6)"></div>

      <div style="display:flex; flex-direction:column; gap:14px">
        <h2 style="font-family:'Press Start 2P', monospace; font-size:18px; line-height:1.5">{{ title }}</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
          <span style="font-family:'VT323', monospace; font-size:15px; padding:1px 8px; border:2px solid var(--border); background:var(--accent-2); color:#000; font-weight:700; letter-spacing:1px">SNES</span>
          <span style="font-family:'VT323', monospace; font-size:17px; color:var(--text-dim)">1995</span>
        </div>

        <div style="border:2px solid var(--border); background:var(--surface-2); box-shadow:4px 4px 0 var(--shadow); padding:20px 22px; display:flex; flex-direction:column; gap:14px; margin-top:6px">
          <span style="font-family:'Press Start 2P', monospace; font-size:11px; letter-spacing:1px">{{ errorLabel }}</span>
          <p style="font-size:15px; line-height:1.6; text-wrap:pretty">{{ message }}</p>

          <sc-if value="{{ hasMeta }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-direction:column; gap:6px; padding-top:6px">
              <sc-for list="{{ meta }}" as="m" hint-placeholder-count="2">
                <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px">
                  <span style="font-size:13px; color:var(--text-dim); font-weight:500">{{ m.k }}</span>
                  <span style="font-family:'VT323', monospace; font-size:18px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px">{{ m.v }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <button type="button" style="align-self:flex-start; margin-top:4px; font-family:'Press Start 2P', monospace; font-size:9px; padding:12px 16px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--accent); color:#000; cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">{{ actionLabel }}</button>
        </div>
      </div>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; },
  &quot;errorType&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;core_fehlt&quot;, &quot;bios_fehlt&quot;, &quot;rom_fehlt&quot;], &quot;default&quot;: &quot;rom_fehlt&quot;, &quot;tsType&quot;: &quot;'core_fehlt'|'bios_fehlt'|'rom_fehlt'&quot;, &quot;section&quot;: &quot;Fehlerfall (C1/C2/C3)&quot; }
}">
const CONFIGS = {
  core_fehlt: {
    title: 'Chrono Trigger',
    errorLabel: '⚠ CORE NICHT INSTALLIERT',
    message: 'Für SNES ist aktuell kein Emulator-Core installiert. Ohne Core kann dieses Spiel nicht gestartet werden.',
    meta: [],
    actionLabel: 'CORE LADEN'
  },
  bios_fehlt: {
    title: 'Wipeout',
    errorLabel: '⚠ BIOS FEHLT',
    message: 'Für PS1-Titel wird eine BIOS-Datei benötigt. RetroArch hat sie an folgendem Ort erwartet, aber nicht gefunden:',
    meta: [
      { k: 'Erwartete Datei', v: 'scph5501.bin' },
      { k: 'Zielpfad', v: '/home/max/Documents/RetroFrontier/BIOS/' }
    ],
    actionLabel: 'IM DATEIMANAGER ZEIGEN'
  },
  rom_fehlt: {
    title: 'Super Metroid',
    errorLabel: '⚠ ROM-DATEI NICHT GEFUNDEN',
    message: 'Die Datei liegt nicht mehr am zuletzt bekannten Ort. Wurde sie verschoben, umbenannt oder gelöscht?',
    meta: [
      { k: 'Letzter bekannter Pfad', v: '/home/max/roms/snes/Super Metroid (Europe).sfc' }
    ],
    actionLabel: 'NEU SUCHEN'
  }
};

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null }; }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    const cfg = CONFIGS[this.props.errorType ?? 'core_fehlt'];
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      title: cfg.title,
      errorLabel: cfg.errorLabel,
      message: cfg.message,
      hasMeta: cfg.meta.length > 0,
      meta: cfg.meta,
      actionLabel: cfg.actionLabel
    };
  }
}
</script>
</body>
</html>
