<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="D1" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:20px; max-width:640px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK ZUM SPIEL
    </button>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; white-space:nowrap; flex-shrink:0">▶ SPIEL-EINSTELLUNGEN</h2>
      <span style="flex:1; height:3px; background:var(--border)"></span>
      <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim); white-space:nowrap">CHRONO TRIGGER</span>
    </div>

    <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow)">
      <h3 style="font-family:'Press Start 2P', monospace; font-size:10px; letter-spacing:1px; padding:12px 16px; border-bottom:2px solid var(--border); background:var(--surface-2)">ÜBERSCHREIBUNGEN FÜR DIESES SPIEL</h3>

      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div style="display:flex; flex-direction:column; gap:10px; padding:13px 16px; border-top:{{ r.border }}">
          <div style="display:flex; align-items:center; gap:14px">
            <div style="flex:1"><b style="display:block; font-size:14.5px">{{ r.name }}</b><small style="font-family:'VT323', monospace; font-size:17px; color:var(--text-dim)">{{ r.globalLabel }}</small></div>
            <button type="button" onClick="{{ r.onToggleOverride }}" style="display:block; position:relative; width:52px; height:26px; flex:none; border:2px solid var(--border); background:{{ r.trackBg }}; cursor:pointer; padding:0" style-focus="background:var(--text)"><i style="position:absolute; top:2px; left:{{ r.knobLeft }}; width:18px; height:18px; background:{{ r.knobBg }}"></i></button>
          </div>
          <sc-if value="{{ r.override }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; align-items:center; gap:10px; padding-left:2px">
              <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px">// ÜBERSCHRIEBEN MIT</span>
              <div style="position:relative">
                <button type="button" onClick="{{ r.select.onToggleOpen }}" style="display:inline-flex; align-items:center; gap:6px; font-family:'VT323', monospace; font-size:18px; padding:5px 10px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text); cursor:pointer" style-focus="background:var(--text); color:var(--bg)">{{ r.select.value }} ▾</button>
                <sc-if value="{{ r.select.open }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute; top:100%; left:0; margin-top:6px; min-width:160px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); z-index:10">
                    <sc-for list="{{ r.select.options }}" as="o" hint-placeholder-count="3">
                      <button type="button" onClick="{{ o.onSelect }}" style="display:block; width:100%; font-family:'VT323', monospace; font-size:18px; padding:7px 12px; border:none; background:{{ o.bg }}; color:var(--text); cursor:pointer; text-align:left; white-space:nowrap" style-hover="background:var(--surface)" style-focus="background:var(--text); color:var(--bg)">{{ o.label }}</button>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const DEFS = [
  { id: 'core', name: 'Core', global: 'Snes9x', options: ['Snes9x', 'bsnes'] },
  { id: 'shader', name: 'Shader', global: 'CRT-Royale', options: ['CRT-Royale', 'CRT-Easymode', 'Aus'] },
  { id: 'aspect', name: 'Seitenverhältnis', global: '4:3', options: ['4:3', '16:9', 'Original'] },
  { id: 'integer', name: 'Integer Scaling', global: 'An', options: ['An', 'Aus'] }
];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      theme: null, openSelect: null,
      overrides: { core: false, shader: true, aspect: false, integer: false },
      values: { core: 'Snes9x', shader: 'CRT-Easymode', aspect: '4:3', integer: 'An' }
    };
  }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    const { overrides, values, openSelect } = this.state;
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      rows: DEFS.map((d, i) => {
        const on = overrides[d.id];
        return {
          name: d.name,
          border: i === 0 ? 'none' : '2px solid var(--border)',
          globalLabel: 'Global: ' + d.global,
          override: on,
          trackBg: on ? 'var(--accent)' : 'var(--bg-soft)',
          knobBg: on ? '#fff' : 'var(--text-dim)',
          knobLeft: on ? '28px' : '2px',
          onToggleOverride: () => this.setState(s => ({ overrides: { ...s.overrides, [d.id]: !s.overrides[d.id] } })),
          select: {
            value: values[d.id],
            open: openSelect === d.id,
            onToggleOpen: () => this.setState(s => ({ openSelect: s.openSelect === d.id ? null : d.id })),
            options: d.options.map(opt => ({
              label: opt,
              bg: opt === values[d.id] ? 'var(--surface)' : 'transparent',
              onSelect: () => this.setState(s => ({ values: { ...s.values, [d.id]: opt }, openSelect: null }))
            }))
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
