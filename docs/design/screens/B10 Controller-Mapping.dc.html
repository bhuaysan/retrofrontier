<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
  @keyframes rf-chase { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="B10" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:20px; max-width:640px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK ZU EINSTELLUNGEN
    </button>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; white-space:nowrap; flex-shrink:0">▶ TASTENBELEGUNG</h2>
      <span style="flex:1; height:3px; background:var(--border)"></span>
    </div>

    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">
      <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">8BITDO PRO 2 · GILT FÜR ALLE SYSTEME</span>
      <div style="position:relative; margin-left:auto">
        <button type="button" onClick="{{ coreSelect.onToggleOpen }}" style="display:inline-flex; align-items:center; gap:6px; font-family:'VT323', monospace; font-size:18px; padding:5px 10px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text); cursor:pointer" style-focus="background:var(--text); color:var(--bg)">{{ coreSelect.value }} ▾</button>
        <sc-if value="{{ coreSelect.open }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute; top:100%; right:0; margin-top:6px; min-width:180px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); z-index:10">
            <sc-for list="{{ coreSelect.options }}" as="o" hint-placeholder-count="2">
              <button type="button" onClick="{{ o.onSelect }}" style="display:block; width:100%; font-family:'VT323', monospace; font-size:18px; padding:7px 12px; border:none; background:{{ o.bg }}; color:var(--text); cursor:pointer; text-align:left; white-space:nowrap" style-hover="background:var(--surface)" style-focus="background:var(--text); color:var(--bg)">{{ o.label }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow)">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <div style="display:flex; align-items:center; gap:14px; padding:13px 16px; border-top:{{ r.border }}">
          <div style="flex:1"><b style="display:block; font-size:14.5px">{{ r.action }}</b><small style="font-family:'VT323', monospace; font-size:17px; color:var(--text-dim)">{{ r.sub }}</small></div>
          <sc-if value="{{ r.listening }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; align-items:center; gap:10px; width:200px">
              <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text)">TASTE DRÜCKEN …</span>
            </div>
          </sc-if>
          <sc-if value="{{ r.listening }}" hint-placeholder-val="{{ false }}">
            <div style="height:9px; width:60px; border:2px solid var(--border); background:var(--bg-soft); overflow:hidden">
              <i style="display:block; height:100%; width:30%; background:var(--accent); animation:rf-chase 1.1s steps(8) infinite"></i>
            </div>
          </sc-if>
          <sc-if value="{{ r.notListening }}" hint-placeholder-val="{{ true }}">
            <span style="font-family:'VT323', monospace; font-size:18px; color:var(--accent); border:2px dashed var(--text-dim); padding:4px 10px; background:var(--bg-soft); min-width:70px; text-align:center">{{ r.binding }}</span>
          </sc-if>
          <button type="button" onClick="{{ r.onRebind }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:12px 10px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">{{ r.rebindLabel }}</button>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-top:6px">
      <button type="button" onClick="{{ onSave }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--accent); color:#000; cursor:pointer; transition:transform .08s ease, box-shadow .08s ease" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">SPEICHERN</button>
      <button type="button" onClick="{{ onReset }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer; transition:transform .08s ease, box-shadow .08s ease" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">STANDARD WIEDERHERSTELLEN</button>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const DEFAULT_ROWS = [
  { id: 'a', action: 'A', sub: 'Bestätigen / Starten', binding: 'A' },
  { id: 'b', action: 'B', sub: 'Zurück', binding: 'B' },
  { id: 'x', action: 'X', sub: 'Favorit', binding: 'X' },
  { id: 'y', action: 'Y', sub: 'Kontextmenü', binding: 'Y' },
  { id: 'start', action: 'Start', sub: 'Menü öffnen', binding: 'START' },
  { id: 'select', action: 'Select', sub: 'Hotkey-Modifikator', binding: 'SELECT' },
  { id: 'l', action: 'L', sub: 'System zurück (Sidebar)', binding: 'L1' },
  { id: 'r', action: 'R', sub: 'System vor (Sidebar)', binding: 'R1' }
];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      theme: null, coreOpen: false, coreValue: 'Global (alle Systeme)',
      rows: DEFAULT_ROWS.map(r => ({ ...r, listening: false }))
    };
  }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      coreSelect: {
        value: this.state.coreValue,
        open: this.state.coreOpen,
        onToggleOpen: () => this.setState(s => ({ coreOpen: !s.coreOpen })),
        options: ['Global (alle Systeme)', 'Snes9x (SNES)'].map(opt => ({
          label: opt,
          bg: opt === this.state.coreValue ? 'var(--surface)' : 'transparent',
          onSelect: () => this.setState({ coreValue: opt, coreOpen: false })
        }))
      },
      rows: this.state.rows.map(r => ({
        ...r,
        notListening: !r.listening,
        rebindLabel: r.listening ? 'ABBRECHEN' : 'NEU BELEGEN',
        border: r.id === 'a' ? 'none' : '2px solid var(--border)',
        onRebind: () => this.setState(s => ({
          rows: s.rows.map(row => row.id === r.id
            ? { ...row, listening: !row.listening, binding: row.listening ? row.binding : row.binding }
            : { ...row, listening: false })
        }))
      })),
      onSave: () => this.setState(s => ({ rows: s.rows.map(r => ({ ...r, listening: false })) })),
      onReset: () => this.setState({ rows: DEFAULT_ROWS.map(r => ({ ...r, listening: false })) })
    };
  }
}
</script>
</body>
</html>
