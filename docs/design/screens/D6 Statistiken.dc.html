<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="D6" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:24px; max-width:760px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK ZUR BIBLIOTHEK
    </button>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; white-space:nowrap; flex-shrink:0">▶ STATISTIKEN</h2>
      <span style="flex:1; height:3px; background:var(--border)"></span>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px">
      <sc-for list="{{ summaryCards }}" as="s" hint-placeholder-count="3">
        <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow); padding:16px 18px; display:flex; flex-direction:column; gap:8px">
          <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px">{{ s.label }}</span>
          <span style="font-family:'VT323', monospace; font-size:28px">{{ s.value }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h3 style="font-family:'Press Start 2P', monospace; font-size:12px; letter-spacing:1px; white-space:nowrap">▶ MEISTGESPIELT</h3>
      <span style="flex:1; height:2px; background:var(--border)"></span>
    </div>

    <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow)">
      <sc-for list="{{ topGames }}" as="g" hint-placeholder-count="5">
        <div style="display:flex; align-items:center; gap:14px; padding:12px 16px; border-top:{{ g.border }}">
          <span style="font-family:'VT323', monospace; font-size:20px; color:var(--text-dim); width:24px; flex:none">{{ g.rank }}</span>
          <div style="width:36px; height:48px; flex:none; border:2px solid var(--border); background:{{ g.cover }}"></div>
          <div style="flex:1; min-width:0">
            <b style="display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ g.title }}</b>
            <small style="font-family:'VT323', monospace; font-size:16px; color:var(--text-dim)">{{ g.badge }}</small>
          </div>
          <span style="font-family:'VT323', monospace; font-size:20px; white-space:nowrap">{{ g.time }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h3 style="font-family:'Press Start 2P', monospace; font-size:12px; letter-spacing:1px; white-space:nowrap">▶ SPIELZEIT PRO SYSTEM</h3>
      <span style="flex:1; height:2px; background:var(--border)"></span>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px">
      <sc-for list="{{ systemBars }}" as="s" hint-placeholder-count="6">
        <div style="display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:12px">
          <span style="font-size:14px; font-weight:600">{{ s.name }}</span>
          <div style="height:16px; border:2px solid var(--border); background:var(--bg-soft)">
            <i style="display:block; height:100%; background:{{ s.color }}; width:{{ s.pct }}%"></i>
          </div>
          <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim); text-align:right">{{ s.hours }}</span>
        </div>
      </sc-for>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const TOP_GAMES = [
  { title: 'Chrono Trigger', badge: 'SNES', time: '18h 40m', cover: 'linear-gradient(160deg, #232a5e, #2f5d3a)' },
  { title: 'Street Fighter II', badge: 'ARC', time: '14h 05m', cover: 'linear-gradient(160deg, #8e3a3a, #5e2a2a)' },
  { title: 'Sonic The Hedgehog 2', badge: 'MD', time: '9h 20m', cover: 'linear-gradient(160deg, #2e2a5e, #12101f)' },
  { title: 'Symphony of the Night', badge: 'PS1', time: '7h 55m', cover: 'linear-gradient(160deg, #3f7a6d, #2e5a50)' },
  { title: "Link's Awakening", badge: 'GB', time: '6h 10m', cover: 'linear-gradient(160deg, #3a4a2a, #1a2a1a)' }
];
const SYSTEM_BARS = [
  { name: 'SNES', color: 'var(--accent-2)', hours: '38h', pct: 100 },
  { name: 'Arcade', color: 'var(--accent-6)', hours: '22h', pct: 58 },
  { name: 'Mega Drive', color: 'var(--accent-3)', hours: '16h', pct: 42 },
  { name: 'PS1', color: 'var(--accent-5)', hours: '13h', pct: 34 },
  { name: 'Game Boy', color: 'var(--accent-4)', hours: '9h', pct: 24 },
  { name: 'NES', color: 'var(--accent)', hours: '3h', pct: 8 }
];

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null }; }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      summaryCards: [
        { label: 'GESAMTSPIELZEIT', value: '101h 15m' },
        { label: 'SITZUNGEN', value: '86' },
        { label: 'AKTIVE TAGE (30)', value: '19' }
      ],
      topGames: TOP_GAMES.map((g, i) => ({ ...g, rank: '#' + (i + 1), border: i === 0 ? 'none' : '2px solid var(--border)' })),
      systemBars: SYSTEM_BARS
    };
  }
}
</script>
</body>
</html>
