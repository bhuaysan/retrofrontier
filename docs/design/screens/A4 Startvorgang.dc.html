<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
  @keyframes rf-chase { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="A4" style="min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; display:grid; place-items:center; position:relative; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <div role="group" aria-label="Theme" style="position:absolute; top:20px; right:24px; display:flex; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
    <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
    <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:26px; width:100%; max-width:560px; padding:40px 28px; text-align:center">

    <div style="width:200px; aspect-ratio:3/4; border:3px solid var(--border); box-shadow:6px 6px 0 var(--shadow); background:linear-gradient(160deg, #232a5e, #2f5d3a)"></div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px; width:100%">
      <span style="font-family:'Press Start 2P', monospace; font-size:13px; line-height:1.5">CHRONO TRIGGER</span>
      <div style="display:flex; align-items:center; gap:10px">
        <span style="font-family:'VT323', monospace; font-size:15px; padding:1px 8px; border:2px solid var(--border); background:var(--accent-2); color:#000; font-weight:700; letter-spacing:1px">SNES</span>
        <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">CORE: SNES9X</span>
      </div>
      <div style="width:60%; height:14px; border:2px solid var(--border); background:var(--bg-soft); overflow:hidden; margin-top:6px">
        <i style="display:block; height:100%; width:30%; background:var(--accent); animation:rf-chase 1.1s steps(8) infinite"></i>
      </div>
      <span style="font-family:'VT323', monospace; font-size:20px; color:var(--text-dim)">RETROARCH WIRD GESTARTET …</span>
    </div>

  </div>

  <div style="position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 24px; font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null }; }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' })
    };
  }
}
</script>
</body>
</html>
