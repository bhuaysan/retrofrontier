<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
  /* Unbestimmt A — Lauflicht im Balken (8 Schritte, kein Easing) */
  @keyframes rf-chase { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  /* Unbestimmt B — Blockfolge */
  @keyframes rf-blocks { 0%,40% { background: var(--bg-soft); } 50%,90% { background: var(--accent); } 100% { background: var(--bg-soft); } }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="A2" style="display:grid; grid-template-rows:auto 1fr auto; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="display:grid; place-items:start center; padding:48px 28px 56px">
    <div style="width:100%; max-width:760px; display:flex; flex-direction:column; gap:26px">

      <div style="display:flex; align-items:baseline; gap:14px">
        <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px">▶ SCAN LÄUFT</h2>
        <span style="flex:1; height:3px; background:var(--border)"></span>
        <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">SCHRITT 2 / 3</span>
      </div>

      <div style="border:2px solid var(--border); background:var(--surface); box-shadow:4px 4px 0 var(--shadow); padding:28px 32px 30px; display:flex; flex-direction:column; gap:22px">

        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">
          <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:2px">// ORDNER</span>
          <span style="font-family:'VT323', monospace; font-size:18px; color:var(--accent); border:2px dashed var(--text-dim); padding:4px 10px; background:var(--bg-soft)">/home/max/roms/</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; min-width:0">
          <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:2px">// PRÜFE DATEI</span>
          <span style="font-family:'VT323', monospace; font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0">{{ currentFile }}</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:16px">
            <span style="font-size:14.5px; font-weight:600">{{ phaseLabel }}</span>
            <span style="font-family:'VT323', monospace; font-size:20px; color:var(--text-dim)">{{ counter }}</span>
          </div>
          <sc-if value="{{ isDeterminate }}" hint-placeholder-val="{{ true }}">
            <div style="height:14px; border:2px solid var(--border); background:var(--bg-soft)">
              <i style="display:block; height:100%; background:var(--accent); width:{{ pct }}%"></i>
            </div>
          </sc-if>
          <sc-if value="{{ isIndeterminate }}" hint-placeholder-val="{{ false }}">
            <div style="height:14px; border:2px solid var(--border); background:var(--bg-soft); overflow:hidden">
              <i style="display:block; height:100%; width:30%; background:var(--accent); animation:rf-chase 1.1s steps(8) infinite"></i>
            </div>
          </sc-if>
        </div>

        <div style="display:flex; flex-direction:column; gap:12px">
          <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:2px">// ERKANNTE SYSTEME</span>
          <div style="display:flex; flex-wrap:wrap; gap:10px">
            <sc-for list="{{ systems }}" as="s" hint-placeholder-count="6">
              <span style="display:inline-flex; align-items:center; gap:8px; padding:5px 10px; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); background:var(--chip-bg)">
                <span style="width:14px; height:14px; flex:none; border:2px solid var(--border); background:{{ s.color }}"></span>
                <span style="font-size:14.5px; font-weight:600">{{ s.name }}</span>
                <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">{{ s.count }}</span>
              </span>
            </sc-for>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-top:4px">
          <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .08s ease, box-shadow .08s ease" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">SCAN ABBRECHEN</button>
          <span style="font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">{{ etaLabel }}</span>
        </div>
      </div>

    </div>
  </main>

  <footer style="display:flex; align-items:center; flex-wrap:wrap; row-gap:4px; gap:18px; padding:10px 24px; border-top:3px solid var(--border); background:var(--surface); font-family:'VT323', monospace; font-size:18px; color:var(--text-dim)">
    <span>RETROARCH 1.19.0</span>
    <span>·</span>
    <span>CONTROLLER: 8BITDO PRO 2</span>
    <span style="flex:1"></span>
    <div style="display:flex; align-items:center; gap:10px">
      <span style="font-family:'Press Start 2P', monospace; font-size:8px; padding:5px 7px; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); background:var(--surface-2); color:var(--text)">B</span>
      <span>SCAN ABBRECHEN</span>
    </div>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; },
  &quot;phase&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;bestimmt&quot;, &quot;unbestimmt&quot;], &quot;default&quot;: &quot;bestimmt&quot;, &quot;tsType&quot;: &quot;'bestimmt'|'unbestimmt'&quot;, &quot;section&quot;: &quot;Zustand&quot; }
}">
const FILES = [
  '/home/max/roms/snes/Chrono Trigger (USA).sfc',
  '/home/max/roms/snes/Super Metroid (Europe).sfc',
  '/home/max/roms/megadrive/Sonic The Hedgehog 2 (World).md',
  '/home/max/roms/gb/Legend of Zelda - Link\u2019s Awakening (USA, Europe).gb',
  '/home/max/roms/ps1/Castlevania - Symphony of the Night (USA) (Track 1).bin',
  '/home/max/roms/arcade/mslug.zip',
  '/home/max/roms/nes/Kirby\u2019s Adventure (USA).nes',
  '/home/max/roms/snes/Mega Man X (USA).sfc',
  '/home/max/roms/ps1/Wipeout (Europe).chd',
  '/home/max/roms/arcade/sf2ce.zip'
];
const TARGETS = [
  { name: 'SNES', color: 'var(--accent-2)', total: 34 },
  { name: 'Mega Drive', color: 'var(--accent-3)', total: 22 },
  { name: 'Game Boy', color: 'var(--accent-4)', total: 27 },
  { name: 'PS1', color: 'var(--accent-5)', total: 18 },
  { name: 'Arcade', color: 'var(--accent-6)', total: 20 },
  { name: 'NES', color: 'var(--accent)', total: 7 }
];
const TOTAL = 128;

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { theme: null, tick: 0 };
  }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() {
    document.documentElement.setAttribute('data-theme', this.theme());
    this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 260);
  }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const t = this.theme();
    const phase = this.props.phase ?? 'bestimmt';
    const indeterminate = phase === 'unbestimmt';
    const scanned = indeterminate
      ? 12 + (this.state.tick % 40)
      : Math.min(TOTAL, 8 + (this.state.tick * 3) % (TOTAL + 24));
    const share = scanned / TOTAL;
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      currentFile: FILES[this.state.tick % FILES.length],
      isDeterminate: !indeterminate,
      isIndeterminate: indeterminate,
      pct: Math.round(share * 100),
      phaseLabel: indeterminate ? 'Ordner wird gelesen …' : 'ROMs werden geprüft',
      counter: indeterminate ? scanned + ' GEFUNDEN' : scanned + ' / ' + TOTAL,
      etaLabel: indeterminate ? 'GESAMTZAHL NOCH UNBEKANNT' : 'CA. ' + Math.max(1, Math.round((TOTAL - scanned) / 9)) + ' S VERBLEIBEND',
      systems: TARGETS.map(s => ({
        name: s.name,
        color: s.color,
        count: indeterminate ? Math.min(s.total, Math.round(s.total * share * 0.4)) : Math.round(s.total * share)
      })),
      blocks: Array.from({ length: 12 }, (_, i) => ({ delay: (i * 0.1).toFixed(1) + 's' }))
    };
  }
}
</script>
</body>
</html>
