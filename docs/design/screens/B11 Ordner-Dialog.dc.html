<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: none; }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="B11" style="min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease; display:grid; place-items:center; padding:24px">

  <div style="width:100%; max-width:600px; border:2px solid var(--border); background:var(--surface); box-shadow:6px 6px 0 var(--shadow); display:flex; flex-direction:column">

    <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:2px solid var(--border); background:var(--surface-2)">
      <span style="font-family:'Press Start 2P', monospace; font-size:11px; letter-spacing:1px">ROM-ORDNER WÄHLEN</span>
      <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
        <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:8px; padding:7px 9px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
        <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:8px; padding:7px 9px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:12px 18px; border-bottom:2px solid var(--border)">
      <sc-for list="{{ breadcrumb }}" as="b" hint-placeholder-count="3">
        <button type="button" onClick="{{ b.onGo }}" style="font-family:'VT323', monospace; font-size:18px; padding:4px 10px; border:2px solid var(--border); background:{{ b.bg }}; color:{{ b.fg }}; cursor:pointer" style-hover="background:var(--surface)" style-focus="background:var(--text); color:var(--bg)">{{ b.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex; flex-direction:column; max-height:320px; overflow:auto; min-height:180px">
      <sc-if value="{{ hasFolders }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ folders }}" as="f" hint-placeholder-count="5">
          <button type="button" onClick="{{ f.onOpen }}" style="display:flex; align-items:center; gap:12px; padding:11px 18px; border:none; border-top:{{ f.border }}; background:transparent; color:var(--text); cursor:pointer; text-align:left; font-family:inherit" style-hover="background:var(--bg-soft)" style-focus="background:var(--text); color:var(--bg)">
            <svg viewBox="0 0 7 6" width="15" height="13" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M0 0h1v1h-1zM1 0h1v1h-1zM2 0h1v1h-1zM0 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM0 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM6 4h1v1h-1zM0 5h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1z"></path></svg>
            <span style="font-size:14.5px; flex:1">{{ f.name }}</span>
          </button>
        </sc-for>
      </sc-if>
      <sc-if value="{{ hasNoFolders }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid; place-items:center; padding:40px 18px; gap:8px; text-align:center">
          <span style="font-family:'VT323', monospace; font-size:20px; color:var(--text-dim)">Keine Unterordner</span>
        </div>
      </sc-if>
    </div>

    <div style="display:flex; align-items:center; gap:14px; padding:12px 18px; border-top:2px solid var(--border); flex-wrap:wrap">
      <span style="font-family:'Press Start 2P', monospace; font-size:9px; color:var(--text-dim); letter-spacing:2px">// GEWÄHLT</span>
      <span style="font-family:'VT323', monospace; font-size:18px; color:var(--accent); border:2px dashed var(--text-dim); padding:4px 10px; background:var(--bg-soft); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ selectedPath }}</span>
    </div>

    <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:2px solid var(--border); justify-content:flex-end">
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:12px 16px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">ABBRECHEN</button>
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:12px 16px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--accent); color:#000; cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">DIESEN ORDNER WÄHLEN</button>
    </div>

  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const TREE = {
  '': ['Downloads', 'Documents', 'roms', 'Emulation'],
  'roms': ['snes', 'megadrive', 'gb', 'ps1', 'arcade', 'nes'],
  'Emulation': ['BIOS', 'Saves'],
  'Downloads': [],
  'Documents': []
};

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null, path: ['Home', 'max', 'roms'] }; }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  renderVals() {
    const t = this.theme();
    const path = this.state.path;
    const leaf = path[path.length - 1];
    const children = TREE[leaf] ?? [];
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      breadcrumb: path.map((seg, i) => ({
        label: seg,
        bg: i === path.length - 1 ? 'var(--surface-2)' : 'var(--chip-bg)',
        fg: 'var(--text)',
        onGo: () => this.setState({ path: path.slice(0, i + 1) })
      })),
      hasFolders: children.length > 0,
      hasNoFolders: children.length === 0,
      folders: children.map((name, i) => ({
        name,
        border: i === 0 ? 'none' : '2px solid var(--border)',
        onOpen: () => this.setState({ path: [...path, name] })
      })),
      selectedPath: '/home/max/' + path.slice(2).join('/') + '/'
    };
  }
}
</script>
</body>
</html>
