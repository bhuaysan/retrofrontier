<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:#121212; --bg-soft:#1b1b1b; --surface:#1e1e1e; --surface-2:#252525;
    --border:#000000; --shadow:#2b2b2b; --text:#f2f2f2; --text-dim:#9a9a9a;
    --accent:#3cb58f; --accent-2:#d0648c; --accent-3:#9a7bd4; --accent-4:#7ba05b;
    --accent-5:#62abd9; --accent-6:#c9834a; --chip-bg:#1e1e1e;
    --scanline:rgba(255,255,255,.028);
  }
  [data-theme="light"] {
    --bg:#f4ecdc; --bg-soft:#efe4cd; --surface:#fbf5e8; --surface-2:#f1e8d4;
    --border:#1a1a1a; --shadow:#1a1a1a; --text:#1a1a1a; --text-dim:#6b6353;
    --accent:#1a8f80; --accent-2:#c8607f; --accent-3:#7c5cc4; --accent-4:#6b8f4e;
    --accent-5:#568db1; --accent-6:#b5753d; --chip-bg:#fbf5e8;
    --scanline:rgba(0,0,0,.03);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-color: var(--text-dim) var(--bg-soft); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    background-image: repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px);
  }
  ::selection { background: var(--accent); color:#000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-3); }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
</style>
</helmet>

<div data-theme="{{ theme }}" data-screen-label="D4" style="display:grid; grid-template-rows:auto 1fr; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; background-image:repeating-linear-gradient(to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px); transition:background .25s ease, color .25s ease">

  <header style="display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:3px solid var(--border); background:var(--surface)">
    <div style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; user-select:none">RETRO<span style="color:var(--accent-2)">FRONTIER</span></div>
    <div role="group" aria-label="Theme" style="display:flex; margin-left:auto; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); overflow:hidden; background:var(--chip-bg)">
      <button type="button" onClick="{{ setDark }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; background:{{ darkBg }}; color:{{ darkFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">DARK</button>
      <button type="button" onClick="{{ setLight }}" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:9px 12px; border:none; border-left:2px solid var(--border); background:{{ lightBg }}; color:{{ lightFg }}; cursor:pointer" style-focus="background:var(--text); color:var(--bg)">LIGHT</button>
    </div>
  </header>

  <main style="padding:26px 28px 60px; display:flex; flex-direction:column; gap:20px; max-width:680px">

    <button type="button" style="display:inline-flex; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:20px; padding:7px 16px; background:var(--chip-bg); color:var(--text); border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); cursor:pointer; align-self:flex-start" style-hover="background:var(--accent-3); color:#000" style-focus="background:var(--text); color:var(--bg)">
      <svg viewBox="0 0 4 7" width="9" height="9" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex:none; display:block"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"></path></svg>
      ZURÜCK ZUM SPIEL
    </button>

    <div style="display:flex; align-items:baseline; gap:14px">
      <h2 style="font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px; white-space:nowrap; flex-shrink:0">▶ METADATEN BEARBEITEN</h2>
      <span style="flex:1; height:3px; background:var(--border)"></span>
    </div>

    <div style="display:grid; grid-template-columns:140px 1fr; gap:24px">
      <div style="display:flex; flex-direction:column; gap:10px">
        <div style="width:100%; aspect-ratio:3/4; border:3px solid var(--border); box-shadow:6px 6px 0 var(--shadow); background:linear-gradient(160deg, #232a5e, #2f5d3a)"></div>
        <button type="button" style="font-family:'Press Start 2P', monospace; font-size:8px; padding:9px 6px; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shadow)">COVER ÄNDERN</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px">

        <label style="display:flex; flex-direction:column; gap:6px">
          <span style="font-size:13px; color:var(--text-dim); font-weight:500">Titel</span>
          <input type="text" value="{{ fields.title }}" onChange="{{ onChange.title }}" style="font-family:'VT323', monospace; font-size:20px; padding:8px 12px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text)" style-focus="box-shadow:0 0 0 3px var(--text) inset, 3px 3px 0 var(--shadow)"/>
        </label>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">
          <div style="display:flex; flex-direction:column; gap:6px">
            <span style="font-size:13px; color:var(--text-dim); font-weight:500">Genre</span>
            <div style="position:relative">
              <button type="button" onClick="{{ genreSelect.onToggleOpen }}" style="display:flex; align-items:center; justify-content:space-between; width:100%; font-family:'VT323', monospace; font-size:18px; padding:6px 10px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text); cursor:pointer" style-focus="background:var(--text); color:var(--bg)">{{ genreSelect.value }} <span>▾</span></button>
              <sc-if value="{{ genreSelect.open }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute; top:100%; left:0; margin-top:6px; width:100%; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); z-index:10">
                  <sc-for list="{{ genreSelect.options }}" as="o" hint-placeholder-count="6">
                    <button type="button" onClick="{{ o.onSelect }}" style="display:block; width:100%; font-family:'VT323', monospace; font-size:18px; padding:7px 12px; border:none; background:{{ o.bg }}; color:var(--text); cursor:pointer; text-align:left" style-hover="background:var(--surface)" style-focus="background:var(--text); color:var(--bg)">{{ o.label }}</button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px">
            <span style="font-size:13px; color:var(--text-dim); font-weight:500">Region</span>
            <div style="position:relative">
              <button type="button" onClick="{{ regionSelect.onToggleOpen }}" style="display:flex; align-items:center; justify-content:space-between; width:100%; font-family:'VT323', monospace; font-size:18px; padding:6px 10px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text); cursor:pointer" style-focus="background:var(--text); color:var(--bg)">{{ regionSelect.value }} <span>▾</span></button>
              <sc-if value="{{ regionSelect.open }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute; top:100%; left:0; margin-top:6px; width:100%; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); z-index:10">
                  <sc-for list="{{ regionSelect.options }}" as="o" hint-placeholder-count="4">
                    <button type="button" onClick="{{ o.onSelect }}" style="display:block; width:100%; font-family:'VT323', monospace; font-size:18px; padding:7px 12px; border:none; background:{{ o.bg }}; color:var(--text); cursor:pointer; text-align:left" style-hover="background:var(--surface)" style-focus="background:var(--text); color:var(--bg)">{{ o.label }}</button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">
          <label style="display:flex; flex-direction:column; gap:6px">
            <span style="font-size:13px; color:var(--text-dim); font-weight:500">Jahr</span>
            <input type="text" value="{{ fields.year }}" onChange="{{ onChange.year }}" style="font-family:'VT323', monospace; font-size:20px; padding:8px 12px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text)" style-focus="box-shadow:0 0 0 3px var(--text) inset, 3px 3px 0 var(--shadow)"/>
          </label>
          <label style="display:flex; flex-direction:column; gap:6px">
            <span style="font-size:13px; color:var(--text-dim); font-weight:500">Entwickler</span>
            <input type="text" value="{{ fields.developer }}" onChange="{{ onChange.developer }}" style="font-family:'VT323', monospace; font-size:20px; padding:8px 12px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--chip-bg); color:var(--text)" style-focus="box-shadow:0 0 0 3px var(--text) inset, 3px 3px 0 var(--shadow)"/>
          </label>
        </div>

        <label style="display:flex; flex-direction:column; gap:6px">
          <span style="font-size:13px; color:var(--text-dim); font-weight:500">Beschreibung</span>
          <textarea value="{{ fields.description }}" onChange="{{ onChange.description }}" rows="4" style="font-family:'Space Grotesk', system-ui, sans-serif; font-size:15px; line-height:1.6; padding:10px 12px; border:2px solid var(--border); background:var(--chip-bg); color:var(--text); resize:vertical" style-focus="box-shadow:0 0 0 3px var(--text) inset"></textarea>
        </label>

      </div>
    </div>

    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-top:6px">
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--accent); color:#000; cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">SPEICHERN</button>
      <button type="button" style="font-family:'Press Start 2P', monospace; font-size:9px; padding:14px 18px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--shadow); background:var(--surface-2); color:var(--text); cursor:pointer" style-hover="transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)" style-active="transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)" style-focus="background:var(--text); color:var(--bg); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)">ABBRECHEN</button>
      <button type="button" style="margin-left:auto; font-family:'VT323', monospace; font-size:18px; padding:7px 14px; border:2px solid var(--border); box-shadow:2px 2px 0 var(--shadow); background:var(--surface-2); color:var(--text-dim); cursor:pointer" style-hover="color:var(--text)" style-focus="background:var(--text); color:var(--bg)">AUF ORIGINAL ZURÜCKSETZEN</button>
    </div>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot; }
}">
const GENRES = ['RPG', 'Action', 'Plattformer', 'Shooter', 'Rennspiel', 'Kampf', 'Puzzle'];
const REGIONS = ['JP', 'US', 'EU', 'JP / US / EU'];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      theme: null, openSelect: null,
      fields: {
        title: 'Chrono Trigger', genre: 'RPG', region: 'JP / US / EU',
        year: '1995', developer: 'Square',
        description: 'Zeitreise-RPG von Square. Rette die Welt über Jahrtausende hinweg — mit aktivem Kampfsystem und über einem Dutzend Enden.'
      }
    };
  }
  theme() { return this.state.theme ?? this.props.theme ?? 'dark'; }
  componentDidMount() { document.documentElement.setAttribute('data-theme', this.theme()); }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.theme()); }
  setField(key, value) { this.setState(s => ({ fields: { ...s.fields, [key]: value } })); }
  makeSelect(id, options) {
    const value = this.state.fields[id];
    return {
      value,
      open: this.state.openSelect === id,
      onToggleOpen: () => this.setState(s => ({ openSelect: s.openSelect === id ? null : id })),
      options: options.map(opt => ({
        label: opt,
        bg: opt === value ? 'var(--surface)' : 'transparent',
        onSelect: () => { this.setField(id, opt); this.setState({ openSelect: null }); }
      }))
    };
  }
  renderVals() {
    const t = this.theme();
    const f = this.state.fields;
    return {
      theme: t,
      darkBg: t === 'dark' ? 'var(--accent-3)' : 'transparent',
      darkFg: t === 'dark' ? '#000' : 'var(--text-dim)',
      lightBg: t === 'light' ? 'var(--accent-3)' : 'transparent',
      lightFg: t === 'light' ? '#000' : 'var(--text-dim)',
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      fields: f,
      onChange: {
        title: (e) => this.setField('title', e.target.value),
        year: (e) => this.setField('year', e.target.value),
        developer: (e) => this.setField('developer', e.target.value),
        description: (e) => this.setField('description', e.target.value)
      },
      genreSelect: this.makeSelect('genre', GENRES),
      regionSelect: this.makeSelect('region', REGIONS)
    };
  }
}
</script>
</body>
</html>
